# Rebuilds the performance history after the close and publishes it.
#
# The dashboard's holdings refresh themselves - every visitor's browser quotes
# live prices - but the daily series behind the Performance tab is built by a
# Node job, and until now somebody had to remember to run it. This runs it on a
# schedule instead, so the history keeps up with the market on its own and the
# only manual step left is uploading the workbook when transactions change.
#
# It reads the published upload from Firebase and writes the three series nodes
# back. It needs no secrets and commits nothing.

name: Rebuild performance history

on:
  schedule:
    # 22:30 UTC on weekdays: 6:30pm New York in summer, 5:30pm in winter, so it
    # is always after the 4:15pm cut-off the builder uses to decide whether
    # today has a close worth including.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:        # and on demand, from the Actions tab

# Two runs writing the same nodes at once would be pointless, not harmful, but
# queue them anyway.
concurrency:
  group: rebuild-performance
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Daily closes rarely change once written, so carrying the cache between
      # runs saves re-downloading 135 tickers and keeps us well clear of the
      # rate limit that once had the builder throttled.
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: tools/pxcache
          key: pxcache-${{ github.run_id }}
          restore-keys: |
            pxcache-

      - name: Build
        run: node tools/build-performance.js

      # Only runs if the build exited cleanly. The builder refuses to write when
      # a holding could not be priced for a day it was held, which is exactly
      # the case where publishing would be worse than publishing nothing.
      - name: Publish
        run: node tools/publish-performance.js

      # The index's own sector weights, so the overweight and underweight figures
      # are measured against what the S&P 500 is now rather than what it was when
      # a table was typed into the page. Its own failure does not fail the run:
      # the dashboard falls back to the last good copy it has.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install openpyxl
        run: python -m pip install --quiet openpyxl

      - name: Refresh S&P 500 sector weights
        continue-on-error: true
        run: python tools/index-weights.py

      - name: Summary
        if: always()
        run: |
          echo "### Performance rebuild" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          # The weights step is allowed to fail without failing the run, so say
          # what is actually published. A date that stops advancing here is the
          # first sign the index feed has broken.
          curl -s --max-time 60 "https://cee-fund-dashboard-640ab-default-rtdb.firebaseio.com/ceeIndexSectors.json"             | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const d=JSON.parse(s);
                console.log('S&P 500 sector weights: as of '+d.asOf+', info tech '+d.weights['Information Technology']+'%, coverage '+d.coverage+'%');
              }catch(e){console.log('S&P 500 sector weights: could not be read')}})" >> $GITHUB_STEP_SUMMARY
          if [ -f tools/perf.json ]; then
            node -e "const p=require('./tools/perf.json');
              console.log('Window: '+p.dates[0]+' to '+p.dates[p.dates.length-1]);
              console.log('Built from: '+(p.source||'unknown'));
              for (const [k,f] of Object.entries(p.funds))
                console.log(f.name+': \$'+Math.round(f.nav[f.nav.length-1]).toLocaleString());
            " >> $GITHUB_STEP_SUMMARY
          fi
